    <script>
      // Ensure window.fetch has both a getter and setter to prevent "Cannot set property fetch of #<Window> which has only a getter"
      (function() {
        try {
          var originalFetch = window.fetch;
          var activeFetch = originalFetch ? originalFetch.bind(window) : null;
          
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return activeFetch;
            },
            set: function(newFetch) {
              activeFetch = newFetch;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          try {
            var proto = Object.getPrototypeOf(window);
            if (proto) {
              Object.defineProperty(proto, 'fetch', {
                get: function() { return activeFetch; },
                set: function(newFetch) { activeFetch = newFetch; },
                configurable: true,
                enumerable: true
              });
            }
          } catch (_) {}
        }
      })();
    </script>
